bind 127.0.0.1 ::1
port 0
protected-mode yes
unixsocket /run/helixweave/redis/redis.sock
unixsocketperm 0660
daemonize no
supervised systemd
dir /var/lib/helixweave/redis
save ""
appendonly no
logfile ""
