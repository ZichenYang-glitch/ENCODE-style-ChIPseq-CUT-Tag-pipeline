# Keep raw/trimmed and R1/R2 identities in FastQC sample labels. Restrict
# filename-based sample naming to controlled FastQC ZIP filenames only.
use_filename_as_sample_name:
  - "fastqc/zip"

module_order:
  - fastqc:
      anchor: "fastqc_raw"
      name: "FastQC (raw input)"
      info: "FastQC results for the original input FASTQ files before trimming."
      path_filters:
        - "*/01_qc/fastqc/raw/*.raw.R1_fastqc.zip"
        - "*/01_qc/fastqc/raw/*.raw.R2_fastqc.zip"
  - fastqc:
      anchor: "fastqc_trimmed"
      name: "FastQC (trimmed reads)"
      info: "FastQC results for real Trim Galore outputs; absent when trimming is disabled."
      path_filters:
        - "*/01_qc/fastqc/trimmed/*.trimmed.R1_fastqc.zip"
        - "*/01_qc/fastqc/trimmed/*.trimmed.R2_fastqc.zip"
  - samtools:
      anchor: "samtools_pre_filter"
      name: "Samtools (aligned, pre-filter)"
      info: "Flagstat and idxstats for the initial sorted alignment before MAPQ and flag filtering."
      path_filters:
        - "*/01_qc/*.flagstat.txt"
        - "*/01_qc/*.idxstats.txt"
      path_filters_exclude:
        - "*.final.flagstat.txt"
  - samtools:
      anchor: "samtools_final"
      name: "Samtools (final alignment)"
      info: "Flagstat for the final BAM after MAPQ/flag filtering and assay-specific duplicate handling."
      path_filters:
        - "*/01_qc/*.final.flagstat.txt"

# Repeated FastQC instances share default General Stats keys, so make every
# visible stage-specific column explicit.
table_columns_name:
  "FastQC (raw input)":
    percent_gc: "GC (raw)"
    avg_sequence_length: "Avg len (raw)"
    median_sequence_length: "Median len (raw)"
    percent_duplicates: "Dups (raw)"
    percent_fails: "Failed (raw)"
    total_sequences: "Seqs (raw)"
  "FastQC (trimmed reads)":
    percent_gc: "GC (trimmed)"
    avg_sequence_length: "Avg len (trimmed)"
    median_sequence_length: "Median len (trimmed)"
    percent_duplicates: "Dups (trimmed)"
    percent_fails: "Failed (trimmed)"
    total_sequences: "Seqs (trimmed)"

custom_data:
  cross_correlation_qc:
    section_name: "Cross-correlation QC"
    description: "Project-level phantompeakqualtools summary with ENCODE-style NSC/RSC quality flags."
    plot_type: "table"
    pconfig:
      id: "cross_correlation_qc"
      title: "Cross-correlation QC"
      col1_header: "Sample"
    headers:
      cc_qc_file:
        title: "Source .cc.qc"
        description: "Original phantompeakqualtools output parsed into the summary."
        hidden: true
      estimated_fragment_length:
        title: "Estimated fragment length"
        description: "Fragment-length estimate from the cross-correlation peak."
      phantom_peak:
        title: "Phantom peak"
        description: "Read-length artifact peak estimated by phantompeakqualtools."
      nsc:
        title: "NSC"
        description: "Normalized Strand Coefficient. ENCODE-style acceptable threshold is >= 1.05."
      rsc:
        title: "RSC"
        description: "Relative Strand Correlation. ENCODE-style acceptable threshold is >= 0.8."
      quality_flag:
        title: "Quality flag"
        description: "Project-assigned flag from NSC/RSC thresholds."

  mnase_qc:
    section_name: "MNase-seq QC"
    description: "Per-sample MNase-seq fragment stratification and QC summary (Stage 40)."
    plot_type: "table"
    pconfig:
      id: "mnase_qc"
      title: "MNase-seq QC Summary"
      col1_header: "Sample"
    headers:
      sub_reads:
        title: "Sub reads"
        description: "Read count in sub-nucleosome BAM (< mono range)."
      mono_reads:
        title: "Mono reads"
        description: "Read count in mono-nucleosome BAM."
      di_reads:
        title: "Di reads"
        description: "Read count in di-nucleosome BAM (> mono range)."
      analysis_status:
        title: "Analysis status"
        description: "ok, no_valid_templates, or parse_failed for the canonical analysis BAM."
      analysis_valid_templates:
        title: "Valid fragments"
        description: "Complete valid PE templates in the canonical analysis BAM."
      analysis_invalid_templates:
        title: "Invalid templates"
        description: "TLEN=0, orphan, cross-contig, or inconsistent templates."
      analysis_classified_templates:
        title: "Classified fragments"
        description: "Valid fragments in the union of the configured windows."
      analysis_unclassified_templates:
        title: "Unclassified fragments"
        description: "Valid fragments outside every configured window."
      analysis_fraction_classified:
        title: "Classified fraction"
        description: "Classified / valid fragments; NA when there are no valid templates."
      window_overlap:
        title: "Window overlap"
        description: "true when configured windows overlap; unclassified uses their union."
      sub_fragments:
        title: "Sub fragments"
        description: "Fragment count in the sub window (may overlap other windows)."
      mono_fragments:
        title: "Mono fragments"
        description: "Fragment count in the mono window (may overlap other windows)."
      di_fragments:
        title: "Di fragments"
        description: "Fragment count in the di window (may overlap other windows)."
      mono_min:
        title: "Mono min (bp)"
        hidden: true
      mono_max:
        title: "Mono max (bp)"
        hidden: true
      dyad_min:
        title: "Dyad min (bp)"
        hidden: true
      dyad_max:
        title: "Dyad max (bp)"
        hidden: true
      caller_danpos3_enabled:
        title: "DANPOS3"
        description: "DANPOS3 caller enabled (execution deferred)."
      caller_inps_enabled:
        title: "iNPS"
        description: "iNPS caller enabled (execution deferred)."
      caller_sem_enabled:
        title: "SEM"
        description: "SEM caller enabled (execution deferred)."

  project_qc_summary:
    section_name: "Project QC Summary"
    description: "Per-sample final-read, FRiP, peak, NRF/PBC, and duplication summary."
    plot_type: "table"
    pconfig:
      id: "project_qc_summary"
      title: "Project QC Summary"
      col1_header: "Sample"
    headers:
      assay:
        title: "Assay"
      target:
        title: "Target"
      genome:
        title: "Genome"
      layout:
        title: "Layout"
      peak_mode:
        title: "Peak mode"
      total_reads:
        title: "Final reads"
      reads_in_peaks:
        title: "Reads in peaks"
      frip:
        title: "FRiP"
        description: "Fraction of reads in peaks."
      peak_count:
        title: "Peaks"
      nrf:
        title: "NRF"
      pbc1:
        title: "PBC1"
      pbc2:
        title: "PBC2"
      percent_duplication:
        title: "Duplication fraction"
      analysis_valid_fragments:
        title: "Analysis fragments"
        description: "Complete valid templates in the canonical analysis BAM."
      analysis_invalid_templates:
        title: "Invalid templates"
        description: "Invalid templates found in the canonical analysis BAM."
      raw_peak_count:
        title: "Raw peaks"
        description: "Peak count before final peak-level blacklist filtering."
      delivered_peak_count:
        title: "Delivered peaks"
        description: "Peak count in the delivered analysis-view peak file."
      duplicate_analysis:
        title: "Duplicate policy"
        description: "Resolved duplicate analysis policy for this sample."
      resolved_max_insert:
        title: "Max insert"
        description: "Resolved PE insert bound, or not_applicable for SE."
      blacklist_mode:
        title: "Blacklist mode"
      blacklist_applied:
        title: "Blacklist applied"
      organelle_mode:
        title: "Organelle mode"
      organelle_status:
        title: "Organelle status"
      organelle_fraction:
        title: "Organelle fraction"
        description: "Organelle reads / total mapped reads at the pre-duplicate stage."
      cross_correlation_nsc:
        title: "NSC"
        description: "Descriptive when reported; no pass/fail threshold is applied."
      cross_correlation_rsc:
        title: "RSC"
        description: "Descriptive when reported; no pass/fail threshold is applied."
      cross_correlation_status:
        title: "Cross-correlation status"
        description: "reported, not_enabled, missing, or parse_failed."
      qc_flag:
        title: "QC flag"

  cuttag_fragment_size:
    section_name: "CUT&Tag fragment sizes"
    description: "PE CUT&Tag fragment-length summary; SE samples report layout_not_supported."
    plot_type: "table"
    pconfig:
      id: "cuttag_fragment_size"
      title: "CUT&Tag Fragment Size QC"
      col1_header: "Sample"
    headers:
      layout:
        title: "Layout"
      fragment_count:
        title: "Fragments"
      fragment_mean:
        title: "Mean (bp)"
      fragment_median:
        title: "Median (bp)"
      fraction_lt_150:
        title: "Fraction <150 bp"
      fraction_150_300:
        title: "Fraction 150-300 bp"
      fraction_300_500:
        title: "Fraction 300-500 bp"
      fraction_ge_500:
        title: "Fraction >=500 bp"
      status:
        title: "Status"
      templates_total:
        title: "Templates"
        description: "All templates observed in the canonical analysis BAM."
      templates_invalid:
        title: "Invalid templates"
        description: "Zero TLEN, orphan, cross-contig, or inconsistent templates."
      invalid_tlen_zero:
        title: "TLEN=0"
        description: "Templates with zero TLEN; never placed in a biological bin."
      invalid_orphan:
        title: "Orphan"
        description: "Templates without two complete mates in the final input."
      invalid_cross_contig:
        title: "Cross-contig"
        description: "Templates whose mates are on different contigs."
      invalid_inconsistent:
        title: "Inconsistent"
        description: "Templates whose mate coordinates, flags, or TLEN disagree."
      upstream_dropped_templates:
        title: "Upstream dropped"
        description: "Templates removed by the analysis-view filter before this BAM."

sp:
  cross_correlation_qc:
    fn: "cross_correlation_summary.tsv"
  mnase_qc:
    fn: "*mnase_qc_summary.tsv"
  project_qc_summary:
    fn: "*project_qc_summary.tsv"
  cuttag_fragment_size:
