[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helixweave"
version = "0.4.1"
description = "HelixWeave local omics platform Python package"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zichen Yang" },
]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23,<5",
    "packaging>=24.2,<27",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/ZichenYang-glitch/ENCODE-style-ChIPseq-CUT-Tag-pipeline"
Repository = "https://github.com/ZichenYang-glitch/ENCODE-style-ChIPseq-CUT-Tag-pipeline"

[project.optional-dependencies]
api = [
    "alembic>=1.13,<2",
    "argon2-cffi>=25.1,<26",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "redis>=7,<9",
    "rq>=2.10,<2.11",
    "sqlalchemy>=2,<3",
]
llm-openai = [
    "openai",
]
dev = [
    "coverage[toml]>=7.10.6,<8",
    "diff-cover>=9,<10",
    "pytest",
    "pytest-cov>=7,<8",
    "ruff==0.15.21",
    "mypy",
    "fakeredis[lua]>=2.36,<3",
    "snakefmt",
]

[project.scripts]
helixweave = "encode_pipeline.cli.app:main"
encode-validate = "encode_pipeline.cli.validate:main"
encode-manifest = "encode_pipeline.cli.manifest:main"
encode-dag = "encode_pipeline.cli.dag:main"
encode-worker = "encode_pipeline.workers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"encode_pipeline.artifacts" = ["artifact-inventory.yaml"]
"encode_pipeline.persistence" = [
    "alembic/script.py.mako",
    "migration-execution-inventory-1.0.0.json",
]
"encode_pipeline.contracts.omics_intake" = ["*.schema.json"]
"encode_pipeline.contracts.nfcore_rnaseq" = ["*.json", "*.txt"]
"encode_pipeline.contracts.deployment" = ["*.json"]
"encode_pipeline.deployment.templates" = ["*"]
"encode_pipeline.frontend_assets" = [
    "asset-manifest.json",
    "static/*",
    "static/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "-v",
    "-m",
    "not real_execution and not platform_real_execution and not bulk_rnaseq_real_execution",
]
xfail_strict = true
markers = [
    "full_main: deterministic but broader contracts run on full-main, dispatch, nightly, and release tiers",
    "platform_real_execution: requires real Redis/RQ, POSIX process control, or a real Snakemake process",
    "real_execution: requires external scientific workflow or bioinformatics executables",
    "bulk_rnaseq_real_execution: requires the pinned local nf-core/rnaseq runtime, real Redis/RQ, Docker, and controlled tiny data",
]

[tool.coverage.run]
source = ["src/encode_pipeline", "scripts", "workflow/lib", "containers"]
branch = true
relative_files = true
patch = ["subprocess"]

[tool.coverage.paths]
migration_execution = [
    "src/encode_pipeline/persistence/alembic",
    "${HELIXWEAVE_COVERAGE_MIGRATION_ROOT-/__helixweave_coverage_migration_root_not_configured__}/helixweave-migration-snapshot-*/alembic",
]

[tool.coverage.report]
fail_under = 83
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    # Explicit frozen Peri A0 Python snapshots. New files are not excluded.
    "scripts/peri_a0/build.py",
    "scripts/peri_a0/cases.py",
    "scripts/peri_a0/configuration.py",
    "scripts/peri_a0/fixtures.py",
    "scripts/peri_a0/observation.py",
    "scripts/peri_a0/os_probe.py",
    "scripts/peri_a0/protocol.py",
    "scripts/peri_a0/relay.py",
    "scripts/peri_a0/run.py",
    "scripts/peri_a0/sandbox.py",
    "scripts/peri_a0/stub.py",
    "scripts/peri_a0/test_contract.py",
    "scripts/peri_a0_closeout/build.py",
    "scripts/peri_a0_closeout/build_candidate.py",
    "scripts/peri_a0_closeout/cases.py",
    "scripts/peri_a0_closeout/closeout_cases.py",
    "scripts/peri_a0_closeout/configuration.py",
    "scripts/peri_a0_closeout/evidence/acp-final/run_scoped.py",
    "scripts/peri_a0_closeout/evidence/acp-final/verify_patch-before.py",
    "scripts/peri_a0_closeout/evidence/acp-final/verify_patch-executed.py",
    "scripts/peri_a0_closeout/fixtures.py",
    "scripts/peri_a0_closeout/observation.py",
    "scripts/peri_a0_closeout/os_probe.py",
    "scripts/peri_a0_closeout/protocol.py",
    "scripts/peri_a0_closeout/relay.py",
    "scripts/peri_a0_closeout/resource_guard.py",
    "scripts/peri_a0_closeout/resource_probe.py",
    "scripts/peri_a0_closeout/run.py",
    "scripts/peri_a0_closeout/sandbox.py",
    "scripts/peri_a0_closeout/stub.py",
    "scripts/peri_a0_closeout/test_contract.py",
    "scripts/peri_a0_closeout/test_runtime.py",
    "scripts/peri_a0_closeout/verify_patch.py",
    "scripts/peri_a0_revision/build.py",
    "scripts/peri_a0_revision/build_candidate.py",
    "scripts/peri_a0_revision/cases.py",
    "scripts/peri_a0_revision/configuration.py",
    "scripts/peri_a0_revision/evidence/verify_patch-before-zero-test-fix.py",
    "scripts/peri_a0_revision/fixtures.py",
    "scripts/peri_a0_revision/observation.py",
    "scripts/peri_a0_revision/os_probe.py",
    "scripts/peri_a0_revision/protocol.py",
    "scripts/peri_a0_revision/relay.py",
    "scripts/peri_a0_revision/resource_guard.py",
    "scripts/peri_a0_revision/resource_probe.py",
    "scripts/peri_a0_revision/run.py",
    "scripts/peri_a0_revision/sandbox.py",
    "scripts/peri_a0_revision/stub.py",
    "scripts/peri_a0_revision/test_contract.py",
    "scripts/peri_a0_revision/test_runtime.py",
    "scripts/peri_a0_revision/verify_patch.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.snakefmt]
line_length = 120
include = '\.smk$|Snakefile'
exclude = '\.snakemake/|workflow/rules/(idr|consensus|report|qc)\.smk$'
